name: Pull Request

on:
  pull_request:
    branches:
      - devel

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-quality:
    name: Python 3.12 unit, lint, and generated-code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/ci_merge-requirements.txt
            requirements/ci_submit-requirements.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libattr1-dev

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements/ci_merge-requirements.txt
          python -m pip install --requirement requirements/ci_submit-requirements.txt
          python -m pip install --no-deps --editable ./requirements
          python -m pip check

      - name: Run unit tests
        run: python -m pytest tests/unit cli/kubectl_kadalu

      - name: Run Python quality checks
        run: |
          make pylint
          make build-grpc
          git diff --exit-code -- csi/csi_pb2.py csi/csi_pb2_grpc.py

  manifests:
    name: Helm and Kubernetes 1.36 manifest checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/ci/renderer-requirements.txt

      - name: Install locked renderer dependencies
        run: python -m pip install --requirement tests/ci/renderer-requirements.txt

      - name: Install pinned Kubernetes tools
        run: tests/ci/install-kubernetes-tools.sh

      - name: Validate chart and rendered manifests
        run: |
          tests/ci/render-manifests.sh
          make gen-manifest
          git diff --exit-code -- manifests

  nomad-jobs:
    name: Nomad 1.4.0 job validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Nomad
        env:
          NOMAD_VERSION: "1.4.0"
          NOMAD_SHA256: "7584e25ee2396f6c7ca99cfce97a67756ef2444dabfe96d2b926e2758c38767a"
        run: |
          archive="${RUNNER_TEMP}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          tool_dir="${RUNNER_TEMP}/kadalu-ci-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            --output "${archive}"
          echo "${NOMAD_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${tool_dir}"
          echo "${tool_dir}" >>"${GITHUB_PATH}"

      - name: Validate Nomad jobs
        run: |
          fixture_key="${RUNNER_TEMP}/nomad-validation-ssh-key.fixture"
          umask 077
          printf '%s\n' 'sanitized-non-secret-fixture-for-nomad-validation' \
            >"${fixture_key}"
          nomad job validate -no-color \
            -var="ssh_priv_path=${fixture_key}" nomad/controller.nomad
          nomad job validate -no-color nomad/nodeplugin.nomad

  kubernetes-1-36:
    name: Kubernetes 1.36 kind API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/ci/renderer-requirements.txt

      - name: Install locked renderer dependencies
        run: python -m pip install --requirement tests/ci/renderer-requirements.txt

      - name: Install pinned Kubernetes tools
        run: tests/ci/install-kubernetes-tools.sh

      - name: Run Kubernetes 1.36 API smoke test
        run: tests/kind/kubernetes-1.36-api-smoke.sh

  image-build:
    name: Build amd64 runtime and CSI test images
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci_merge-requirements.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libattr1-dev

      - name: Build kubectl-kadalu
        env:
          KADALU_VERSION: ci
        run: |
          python -m pip install --requirement requirements/ci_merge-requirements.txt
          python -m pip install --no-deps --editable ./requirements
          make cli-build

      - name: Derive reproducible image metadata
        run: |
          echo "IMAGE_BUILDDATE=$(git show --no-patch --format=%cI "${GITHUB_SHA}")" \
            >>"${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build pinned builder, runtime, and CSI test images
        env:
          IMAGE_REPOSITORY: kadalu-ci
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_TAG: test
          KADALU_VERSION: ${{ github.sha }}
        run: docker buildx bake ci-images

      - name: Verify CSI sanity version
        run: |
          test "$(docker run --rm --entrypoint /usr/local/sbin/csi-sanity \
            kadalu-ci/test-csi:test --version)" = "Version = v5.5.0"

      - name: Install pinned Kubernetes tools
        run: tests/ci/install-kubernetes-tools.sh

      - name: Run Kubernetes 1.36 storage lifecycle
        env:
          IMAGE_REPOSITORY: kadalu-ci
          IMAGE_TAG: test
        run: tests/kind/kubernetes-1.36-storage-smoke.sh

name: Release

on:
  push:
    tags:
      - "*"

permissions:
  actions: read
  contents: read

concurrency:
  # Serialize releases globally so an older stable tag cannot move latest
  # after a newer stable release has completed.
  group: release-publishing
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require canonical registry-safe SemVer
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          core = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|(?=[0-9A-Za-z-]*[A-Za-z-])[0-9A-Za-z-]+)"
          pattern = re.compile(
              rf"^{core}\.{core}\.{core}(?:-{identifier}(?:\.{identifier})*)?$"
          )
          if not pattern.fullmatch(tag):
              raise SystemExit(
                  "Release tag must be canonical SemVer without a v prefix or "
                  f"build metadata: {tag}"
              )

          stable = re.fullmatch(rf"{core}\.{core}\.{core}", tag) is not None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stable={str(stable).lower()}\n")
              output.write(f"version={tag}\n")
          PY

  build-artifacts:
    name: Build release artifacts
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci_merge-requirements.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libattr1-dev

      - name: Install locked release dependencies
        run: python -m pip install --requirement requirements/ci_merge-requirements.txt

      - name: Install pinned release tools
        run: tests/ci/install-kubernetes-tools.sh

      - name: Build and verify release artifacts
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          KADALU_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          make cli-build
          make prepare-release-manifests
          make helm-chart
          make pypi-build
          python -m twine check server/dist/*

          shopt -s nullglob
          release_files=(
            manifests/*.yaml
            cli/build/kubectl-kadalu*
            extras/install.sh
            helm/kadalu-helm-chart.tgz
          )
          python_files=(server/dist/*)
          if (( ${#release_files[@]} == 0 || ${#python_files[@]} == 0 )); then
            echo "Release artifact set is incomplete" >&2
            exit 1
          fi

          tar --create --gzip --file release-bundle.tar.gz \
            "${release_files[@]}" \
            "${python_files[@]}"

      - name: Upload temporary release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish-images:
    name: Publish immutable multi-architecture images
    needs:
      - validate-release
      - build-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Require all publishing credentials
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          if [[ -z "${DOCKER_USER}" || -z "${DOCKER_PASSWORD}" ]]; then
            echo "DOCKER_USER and DOCKER_PASSWORD are required for a release" >&2
            exit 1
          fi
          if [[ "${DOCKER_USER}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "DOCKER_USER must exactly match github.repository_owner" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download temporary release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: .release-artifact

      - name: Restore release artifacts
        run: tar --extract --gzip --file .release-artifact/release-bundle.tar.gz

      - name: Derive reproducible image metadata
        id: metadata
        run: |
          echo "builddate=$(git show --no-patch --format=%cI "${GITHUB_SHA}")" \
            >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Preserve immutable version tags
        id: images
        env:
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_TAG: ${{ needs.validate-release.outputs.version }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        run: |
          check_image() {
            local key="$1"
            local image="$2"
            local output
            local reference="docker.io/${REGISTRY_NAMESPACE}/${image}:${IMAGE_TAG}"

            if output=$(docker buildx imagetools inspect "${reference}" 2>&1); then
              tests/ci/verify-image-provenance.sh \
                "${reference}" "${GITHUB_SHA}" "${EXPECTED_SOURCE}"
              echo "${key}_missing=false" >>"${GITHUB_OUTPUT}"
              echo "Preserving existing immutable image ${reference}"
            elif grep -Eqi 'manifest unknown|not found|repository does not exist' <<<"${output}"; then
              echo "${key}_missing=true" >>"${GITHUB_OUTPUT}"
            else
              echo "Unable to verify immutable image ${reference}" >&2
              echo "${output}" >&2
              exit 1
            fi
          }

          check_image builder builder
          check_image csi kadalu-csi
          check_image operator kadalu-operator
          check_image server kadalu-server

      - name: Build and publish builder image
        if: steps.images.outputs.builder_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extras/Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: docker.io/${{ github.repository_owner }}/builder:${{ needs.validate-release.outputs.version }}
          build-args: |
            version=${{ needs.validate-release.outputs.version }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish CSI image
        if: steps.images.outputs.csi_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: csi/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          no-cache: true
          tags: docker.io/${{ github.repository_owner }}/kadalu-csi:${{ needs.validate-release.outputs.version }}
          build-args: |
            builder_image=docker.io/${{ github.repository_owner }}/builder:${{ needs.validate-release.outputs.version }}
            version=${{ needs.validate-release.outputs.version }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish operator image
        if: steps.images.outputs.operator_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: kadalu_operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          no-cache: true
          tags: docker.io/${{ github.repository_owner }}/kadalu-operator:${{ needs.validate-release.outputs.version }}
          build-args: |
            builder_image=docker.io/${{ github.repository_owner }}/builder:${{ needs.validate-release.outputs.version }}
            version=${{ needs.validate-release.outputs.version }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish server image
        if: steps.images.outputs.server_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          no-cache: true
          tags: docker.io/${{ github.repository_owner }}/kadalu-server:${{ needs.validate-release.outputs.version }}
          build-args: |
            builder_image=docker.io/${{ github.repository_owner }}/builder:${{ needs.validate-release.outputs.version }}
            version=${{ needs.validate-release.outputs.version }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify every immutable version image
        env:
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_TAG: ${{ needs.validate-release.outputs.version }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        run: |
          for image in builder kadalu-csi kadalu-operator kadalu-server; do
            tests/ci/verify-image-provenance.sh \
              "docker.io/${REGISTRY_NAMESPACE}/${image}:${IMAGE_TAG}" \
              "${GITHUB_SHA}" \
              "${EXPECTED_SOURCE}"
          done

  publish-github-release:
    name: Stage GitHub release assets
    needs:
      - validate-release
      - build-artifacts
      - publish-images
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download temporary release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: .release-artifact

      - name: Restore release artifacts
        run: tar --extract --gzip --file .release-artifact/release-bundle.tar.gz

      - name: Create release and upload only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.version }}
          STABLE_RELEASE: ${{ needs.validate-release.outputs.stable }}
        run: |
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_args=(
              --repo "${GITHUB_REPOSITORY}"
              --verify-tag
              --title "${RELEASE_TAG}"
              --generate-notes
              --draft
            )
            if [[ "${STABLE_RELEASE}" != "true" ]]; then
              release_args+=(--prerelease --latest=false)
            fi
            gh release create "${RELEASE_TAG}" "${release_args[@]}"
          fi

          shopt -s nullglob
          release_files=(
            manifests/*.yaml
            cli/build/kubectl-kadalu*
            extras/install.sh
            helm/kadalu-helm-chart.tgz
            server/dist/*
          )
          if (( ${#release_files[@]} == 0 )); then
            echo "No GitHub release assets were restored" >&2
            exit 1
          fi

          declare -A names=()
          for asset in "${release_files[@]}"; do
            name="${asset##*/}"
            if [[ -n "${names[${name}]:-}" ]]; then
              echo "Duplicate release asset name: ${name}" >&2
              exit 1
            fi
            names["${name}"]="${asset}"
          done

          existing_assets=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name')
          for asset in "${release_files[@]}"; do
            name="${asset##*/}"
            if grep -Fqx "${name}" <<<"${existing_assets}"; then
              echo "Preserving existing immutable release asset ${name}"
              continue
            fi
            gh release upload "${RELEASE_TAG}" "${asset}" \
              --repo "${GITHUB_REPOSITORY}"
          done

  publish-pypi:
    name: Optionally publish quotad to PyPI
    needs:
      - validate-release
      - build-artifacts
      - publish-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Detect fork-owned PyPI credentials
        id: pypi
        env:
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          if [[ -n "${TWINE_PASSWORD}" ]]; then
            echo "enabled=true" >>"${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >>"${GITHUB_OUTPUT}"
            echo "Skipping PyPI: this fork has no PyPI publishing credential"
          fi

      - name: Check out source
        if: steps.pypi.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.pypi.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci_merge-requirements.txt

      - name: Install native build dependencies
        if: steps.pypi.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libattr1-dev

      - name: Install locked release dependencies
        if: steps.pypi.outputs.enabled == 'true'
        run: python -m pip install --requirement requirements/ci_merge-requirements.txt

      - name: Download temporary release bundle
        if: steps.pypi.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: .release-artifact

      - name: Restore release artifacts
        if: steps.pypi.outputs.enabled == 'true'
        run: tar --extract --gzip --file .release-artifact/release-bundle.tar.gz

      - name: Publish immutable Python distribution
        if: steps.pypi.outputs.enabled == 'true'
        env:
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME || '__token__' }}
        run: |
          python -m twine check server/dist/*
          python -m twine upload --non-interactive --skip-existing server/dist/*

  finalize-release:
    name: Publish completed GitHub release
    needs:
      - validate-release
      - publish-pypi
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      advance_latest: ${{ steps.latest.outputs.advance }}
    steps:
      - name: Determine whether this release may advance latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.version }}
          STABLE_RELEASE: ${{ needs.validate-release.outputs.stable }}
        run: |
          advance=false
          if [[ "${STABLE_RELEASE}" == "true" ]]; then
            current=$(gh release view \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName \
              --jq '.tagName' 2>/dev/null || true)
            if [[ -z "${current}" ]]; then
              advance=true
            else
              advance=$(CURRENT_RELEASE="${current}" python - <<'PY'
          import os
          import re

          def core_version(value):
              match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value)
              if match is None:
                  raise SystemExit(f"Latest release is not comparable SemVer: {value}")
              return tuple(map(int, match.groups()))

          current = core_version(os.environ["CURRENT_RELEASE"])
          candidate = core_version(os.environ["RELEASE_TAG"])
          print(str(candidate >= current).lower())
          PY
              )
            fi
          fi
          echo "advance=${advance}" >>"${GITHUB_OUTPUT}"

      - name: Publish the staged release
        env:
          ADVANCE_LATEST: ${{ steps.latest.outputs.advance }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.version }}
          STABLE_RELEASE: ${{ needs.validate-release.outputs.stable }}
        run: |
          draft=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft')
          if [[ "${draft}" == "true" ]]; then
            release_args=(--repo "${GITHUB_REPOSITORY}" --draft=false)
            if [[ "${STABLE_RELEASE}" == "true" && "${ADVANCE_LATEST}" == "true" ]]; then
              release_args+=(--latest)
            else
              release_args+=(--latest=false)
            fi
            gh release edit "${RELEASE_TAG}" \
              "${release_args[@]}"
          else
            echo "Release ${RELEASE_TAG} is already published; preserving it"
          fi

  update-latest:
    name: Update stable latest image aliases
    if: >-
      needs.validate-release.outputs.stable == 'true' &&
      needs.finalize-release.outputs.advance_latest == 'true'
    needs:
      - validate-release
      - finalize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact Docker Hub credentials
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          if [[ -z "${DOCKER_USER}" || -z "${DOCKER_PASSWORD}" ]]; then
            echo "DOCKER_USER and DOCKER_PASSWORD are required for a release" >&2
            exit 1
          fi
          if [[ "${DOCKER_USER}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "DOCKER_USER must exactly match github.repository_owner" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Update latest only after the stable release is complete
        env:
          IMAGE_TAG: ${{ needs.validate-release.outputs.version }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
        run: |
          for image in builder kadalu-csi kadalu-operator kadalu-server; do
            versioned="docker.io/${REGISTRY_NAMESPACE}/${image}:${IMAGE_TAG}"
            docker buildx imagetools inspect "${versioned}" >/dev/null
            docker buildx imagetools create \
              --tag "docker.io/${REGISTRY_NAMESPACE}/${image}:latest" \
              "${versioned}"
          done

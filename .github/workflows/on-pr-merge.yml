name: Development Images

on:
  push:
    branches:
      - devel
    paths-ignore:
      - "doc/**"
      - "**.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: true

jobs:
  publish:
    name: Publish multi-architecture development images
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive GHCR namespace
        id: registry
        run: |
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >>"${GITHUB_OUTPUT}"

      - name: Derive reproducible image metadata
        id: metadata
        run: |
          echo "builddate=$(git show --no-patch --format=%cI "${GITHUB_SHA}")" \
            >>"${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci_merge-requirements.txt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libattr1-dev

      - name: Build kubectl-kadalu
        run: |
          python -m pip install --requirement requirements/ci_merge-requirements.txt
          python -m pip install --no-deps --editable ./requirements
          KADALU_VERSION=devel make cli-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Preserve immutable commit image tags
        id: images
        env:
          REGISTRY_NAMESPACE: ${{ steps.registry.outputs.namespace }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          while read -r key image; do
            reference="ghcr.io/${REGISTRY_NAMESPACE}/${image}:${GITHUB_SHA}"
            if docker buildx imagetools inspect "${reference}" >/dev/null 2>&1; then
              tests/ci/verify-image-provenance.sh \
                "${reference}" "${GITHUB_SHA}" "${EXPECTED_SOURCE}"
              echo "${key}_missing=false" >>"${GITHUB_OUTPUT}"
              echo "Preserving existing immutable image ${reference}"
            else
              echo "${key}_missing=true" >>"${GITHUB_OUTPUT}"
            fi
          done <<'IMAGES'
          builder kadalu-builder
          csi kadalu-csi
          operator kadalu-operator
          server kadalu-server
          IMAGES

      - name: Build and publish builder image
        if: steps.images.outputs.builder_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extras/Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-builder:${{ github.sha }}
          build-args: |
            version=${{ github.sha }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish CSI image
        if: steps.images.outputs.csi_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: csi/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-csi:${{ github.sha }}
          build-args: |
            builder_image=ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-builder:${{ github.sha }}
            version=${{ github.sha }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish operator image
        if: steps.images.outputs.operator_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: kadalu_operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-operator:${{ github.sha }}
          build-args: |
            builder_image=ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-builder:${{ github.sha }}
            version=${{ github.sha }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish server image
        if: steps.images.outputs.server_missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-server:${{ github.sha }}
          build-args: |
            builder_image=ghcr.io/${{ steps.registry.outputs.namespace }}/kadalu-builder:${{ github.sha }}
            version=${{ github.sha }}
            builddate=${{ steps.metadata.outputs.builddate }}
            revision=${{ github.sha }}
            source=${{ github.server_url }}/${{ github.repository }}

      - name: Update moving development tags
        env:
          REGISTRY_NAMESPACE: ${{ steps.registry.outputs.namespace }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for image in kadalu-builder kadalu-csi kadalu-operator kadalu-server; do
            tests/ci/verify-image-provenance.sh \
              "ghcr.io/${REGISTRY_NAMESPACE}/${image}:${GITHUB_SHA}" \
              "${GITHUB_SHA}" \
              "${EXPECTED_SOURCE}"
            docker buildx imagetools create \
              --tag "ghcr.io/${REGISTRY_NAMESPACE}/${image}:devel" \
              "ghcr.io/${REGISTRY_NAMESPACE}/${image}:${GITHUB_SHA}"
          done

      - name: Verify development images are anonymously pullable
        env:
          REGISTRY_NAMESPACE: ${{ steps.registry.outputs.namespace }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          for image in kadalu-builder kadalu-csi kadalu-operator kadalu-server; do
            DOCKER_CONFIG="${anonymous_config}" docker manifest inspect \
              "ghcr.io/${REGISTRY_NAMESPACE}/${image}:devel" >/dev/null
          done

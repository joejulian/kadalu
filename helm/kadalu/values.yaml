# Default values for kadalu
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Empty uses the packaged chart version; source-tree renders use "devel".
  kadaluVersion: ''
  image:
    registry: 'ghcr.io'
    repository: 'joejulian'
    pullPolicy: 'IfNotPresent'
  kubeletDir: ''
  kubernetesDistro: 'kubernetes'
  csiSidecarRegistry: 'registry.k8s.io'
  busyboxImage: 'docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0'

# Values while deploying operator
operator:
  enabled: false
  verbose: 'no'
  # Operator readiness includes a manual OnDelete rollout and topology-sized,
  # serial storage reconciliation. Keep this as a long Kubernetes diagnostic
  # backstop; use the shorter Helm or GitOps action timeout as the operational
  # failure boundary and size it for the planned maintenance.
  progressDeadlineSeconds: 86400
